<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مدیریت رستوران</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f4;--card:#fff;--ink:#101d19;--mute:#64756e;--line:#e1e8e4;--acc:#e2452f;--accfg:#fff;--ok:#12805c;--okfg:#fff;--warn:#b9770e;--sh:0 1px 2px rgba(16,29,25,.06),0 4px 14px rgba(16,29,25,.05);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0c1311;--card:#151f1b;--ink:#e8f1ec;--mute:#93a69c;--line:#243029;--acc:#f0604b;--accfg:#1a0705;--ok:#2fb98a;--okfg:#04170f;--warn:#e6a940;--sh:none}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0c1311;--card:#151f1b;--ink:#e8f1ec;--mute:#93a69c;--line:#243029;--acc:#f0604b;--accfg:#1a0705;--ok:#2fb98a;--okfg:#04170f;--warn:#e6a940;--sh:none}
:root[data-theme="ios"]{color-scheme:light;--bg:#f2f2f7;--card:#fff;--ink:#000;--mute:#8e8e93;--line:#e5e5ea;--acc:#ff3b30;--accfg:#fff;--ok:#007aff;--okfg:#fff;--warn:#ff9500;--sh:0 0 0 .5px rgba(0,0,0,.08)}
:root[data-theme="classic"]{color-scheme:light;--bg:#f3ead8;--card:#fffaf0;--ink:#2b1d12;--mute:#7a6652;--line:#e0d3bb;--acc:#9c2f1e;--accfg:#fff;--ok:#6b4a2b;--okfg:#fff;--warn:#b9770e;--sh:0 1px 0 rgba(80,50,20,.15)}
:root[data-theme="plain"]{color-scheme:light;--bg:#fff;--card:#f5f6f7;--ink:#111;--mute:#666;--line:#e2e4e6;--acc:#d92d20;--accfg:#fff;--ok:#2563eb;--okfg:#fff;--warn:#b54708;--sh:none}
.lnk{flex:1;display:block;text-align:center;text-decoration:none}
.cust{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px}.cust input{margin:0}
.note{flex-basis:100%;margin-top:6px;padding:8px 10px;font-size:13px}
.wrapc{flex-wrap:wrap}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.7 'Vazirmatn',Tahoma,system-ui,sans-serif;padding-bottom:calc(175px + env(safe-area-inset-bottom,0px))}
#main{max-width:680px;margin:0 auto;padding:6px 16px}
h1{font-size:23px;font-weight:800;margin:14px 0 10px}
h2{font-size:16px;font-weight:600;margin:22px 0 8px}
small{display:block;color:var(--mute);font-size:12.5px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.ch{flex:none;padding:7px 15px;border-radius:99px;background:var(--card);box-shadow:var(--sh);font-size:14px;position:relative;white-space:nowrap}
.ch.on{background:var(--ink);color:var(--bg);font-weight:600}
.ch.dot::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:9px;height:9px;border-radius:50%;background:var(--acc)}
.items{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:520px){.items{grid-template-columns:repeat(3,1fr)}}
.it{position:relative;overflow:hidden;text-align:start;aspect-ratio:1;border-radius:28px;background:var(--card);box-shadow:var(--sh);width:100%;border:.5px solid rgba(120,120,120,.3);display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer}
.it b{display:block;font-weight:600;font-size:14px;line-height:1.35;color:#fff}
.it small{font-size:12.5px;color:rgba(255,255,255,.9)}
.it img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-bottom:30px;font-size:48px;font-weight:800;color:var(--ok);background:var(--line)}
.cap{position:relative;padding:32px 12px 11px;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.it.sel{border-color:var(--ok);box-shadow:0 0 0 1.5px var(--ok)}
@media(prefers-reduced-motion:no-preference){.it{transition:transform .12s}.it:active{transform:scale(.97)}}
.bd{position:absolute;top:8px;inset-inline-end:8px;min-width:26px;height:26px;border-radius:13px;background:var(--ok);color:var(--okfg);font-weight:700;text-align:center;line-height:26px;font-size:13px;padding:0 6px}
.mn{position:absolute;top:8px;inset-inline-start:8px;width:32px;height:32px;border-radius:16px;background:rgba(255,255,255,.92);color:#101d19;font-size:20px;line-height:1}
.cart{position:fixed;inset-inline:0;bottom:calc(88px + env(safe-area-inset-bottom,0px));padding:0 16px;z-index:9;pointer-events:none}
.cart button{pointer-events:auto;display:flex;justify-content:space-between;width:100%;max-width:648px;margin:auto;padding:14px 18px;border-radius:16px;background:var(--ok);color:var(--okfg);font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:520px){.grid{grid-template-columns:repeat(3,1fr)}}
.tb{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:start;padding:14px;border-radius:16px;background:var(--card);box-shadow:var(--sh);min-height:88px}
.tb b{font-size:17px}.tb span{font-size:12.5px;color:var(--mute)}
.tb.busy{background:var(--acc);color:var(--accfg)}
.tb.busy span{color:var(--accfg);opacity:.9}
.row{display:flex;gap:10px;margin-top:14px}
.row>button{flex:1}
.pri,.ghost,.danger{padding:13px 14px;border-radius:12px;font-weight:600}
.pri{background:var(--ok);color:var(--okfg)}
.ghost{background:var(--card);box-shadow:var(--sh)}
.danger{color:var(--acc);background:var(--card);box-shadow:inset 0 0 0 1.5px var(--acc)}
.wide{display:block;width:100%;margin-top:14px}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;text-align:start}
.li b{font-weight:600}
.li.low{border-inline-start:4px solid var(--warn);padding-inline-start:10px}
.nm{flex:1;text-align:start}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:38px;height:38px;border-radius:12px;background:var(--bg);font-size:20px;line-height:1}
.qty span{min-width:26px;text-align:center;font-weight:600}
.tot{display:flex;justify-content:space-between;padding:14px 0 0;font-size:18px}
.alert{background:var(--card);box-shadow:inset 0 0 0 1.5px var(--warn);color:var(--warn);padding:8px 12px;border-radius:12px;margin:0 0 6px}
.empty{color:var(--mute)}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum div{background:var(--card);box-shadow:var(--sh);border-radius:16px;padding:12px 14px}
.sum div:first-child{grid-column:1/-1;background:var(--ok);color:var(--okfg)}
.sum div:first-child small{color:inherit;opacity:.85}
.sum b{font-size:19px;font-weight:800}
.bar{display:grid;grid-template-columns:7.5rem 1fr 2rem;gap:8px;align-items:center;padding:4px 0}
.bar .tr{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.bar em{font-style:normal;color:var(--mute);text-align:end}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;display:flex;padding:4px;border-radius:28px;background:rgba(255,255,255,.62);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);box-shadow:0 8px 28px rgba(0,0,0,.14),inset 0 0 0 1px rgba(255,255,255,.55);z-index:10}
nav button{flex:1;padding:9px 0 8px;font-size:11px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;border-radius:22px}
nav svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nb{position:absolute;top:3px;left:calc(50% + 3px);min-width:17px;height:17px;border-radius:9px;background:var(--acc);color:var(--accfg);font-size:10px;line-height:17px;font-weight:700;font-style:normal;text-align:center;padding:0 4px}
.nb:empty{display:none}
#main{position:relative}
.gear{position:absolute;top:14px;inset-inline-end:16px;width:42px;height:42px;border-radius:50%;background:var(--card);box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.gear svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--ok);font-weight:600}
nav button.on svg{stroke-width:2.2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav{background:rgba(24,34,30,.55);box-shadow:0 8px 28px rgba(0,0,0,.4),inset 0 0 0 1px rgba(255,255,255,.1)}}
:root[data-theme="dark"] nav{background:rgba(24,34,30,.55);box-shadow:0 8px 28px rgba(0,0,0,.4),inset 0 0 0 1px rgba(255,255,255,.1)}
#sh{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
#sh.open{display:flex}
.in{background:var(--card);width:100%;max-width:680px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));position:relative}
.in h2{margin-top:2px}
.x{position:absolute;top:10px;inset-inline-end:10px;width:36px;height:36px;border-radius:18px;font-size:18px;color:var(--mute)}
label{display:block;margin-top:12px;font-size:13px;color:var(--mute)}
input,select{display:block;width:100%;margin-top:4px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.err{color:var(--acc);min-height:1.2em;font-size:13px}
#toast{position:fixed;inset-inline:16px;bottom:calc(150px + env(safe-area-inset-bottom,0px));max-width:420px;margin:auto;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#toast.on{opacity:1}
.rc{background:#fff;color:#000;padding:14px;border-radius:10px;max-width:var(--rcw,300px);margin:6px auto;font-size:13px;line-height:1.6;box-shadow:0 0 0 1px var(--line)}
.rc h3{text-align:center;margin:0 0 4px;font-size:17px}
.rc p{margin:2px 0;text-align:center;font-size:12px}
.rc table{width:100%;border-collapse:collapse;margin:8px 0;border-top:1px dashed #000;border-bottom:1px dashed #000}
.rc td{padding:3px 0}.rc td:nth-child(2){text-align:center}.rc td:last-child{text-align:end}
.rc .tt{display:flex;justify-content:space-between;font-size:15px;font-weight:700}
#rc{display:none}
@media print{
 @page{size:80mm auto;margin:3mm}
 body>*{display:none!important}
 body>#rc{display:block!important}
 body{padding:0;background:#fff}
 #rc .rc{box-shadow:none;max-width:none;margin:0;padding:0}
}
.tot{background:var(--ok);color:var(--okfg);border-radius:16px;padding:14px 16px;margin-top:12px;font-size:18px}
.fr{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);padding-top:6px}
.rc .fr{color:#000;font-size:12.5px}
.nd{margin-top:10px}.nd summary{cursor:pointer;padding:10px 12px;border-radius:12px;background:var(--bg);color:var(--mute)}
.mn{background:rgba(226,69,47,.5);color:#fff;border:1px solid rgba(255,255,255,.4);-webkit-backdrop-filter:blur(10px) saturate(160%);backdrop-filter:blur(10px) saturate(160%)}
.bd{background:rgba(18,128,92,.6);background:color-mix(in srgb,var(--ok) 58%,transparent);color:#fff;border:1px solid rgba(255,255,255,.4);-webkit-backdrop-filter:blur(10px) saturate(160%);backdrop-filter:blur(10px) saturate(160%)}
.qty button:first-child{background:rgba(226,69,47,.16);color:var(--acc);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:inset 0 0 0 1px rgba(226,69,47,.35)}
.qty button:last-child{background:rgba(18,128,92,.16);background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:inset 0 0 0 1px rgba(18,128,92,.35)}
.qty span{display:inline-block}
.up{animation:rUp .3s cubic-bezier(.2,.9,.3,1.2)}.dn{animation:rDn .3s cubic-bezier(.2,.9,.3,1.2)}
@keyframes rUp{from{transform:translateY(70%);opacity:0}to{transform:none;opacity:1}}
@keyframes rDn{from{transform:translateY(-70%);opacity:0}to{transform:none;opacity:1}}
#splash{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 38%,var(--ok),#07120e 78%);color:#fff;transition:transform .75s cubic-bezier(.7,0,.2,1)}
#splash.out{transform:translateY(-100%)}
.sp{text-align:center}.sp svg{width:88px;height:88px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.sp circle{stroke-dasharray:252;stroke-dashoffset:252;animation:draw 1.1s .1s ease forwards}
.sp path{stroke-dasharray:130;stroke-dashoffset:130;animation:draw .9s .7s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
#spt{font-size:34px;font-weight:800;margin-top:18px}
#spt span{display:inline-block;opacity:0;transform:translateY(28px);filter:blur(10px);animation:rise .85s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none;filter:none}}
@media(prefers-reduced-motion:reduce){.up,.dn{animation:none}#splash{transition:none}.sp circle,.sp path{animation:none;stroke-dashoffset:0}#spt span{animation:none;opacity:1;transform:none;filter:none}}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>

<div id="main"></div>
<div id="cartbar" class="cart"></div>
<nav>

</nav>
<div id="sh" onclick="if(event.target===this)closeSheet()"></div>

<div id="rc"></div>
<script>
const $=s=>document.querySelector(s);
const fa=n=>Number(n).toLocaleString('fa-IR',{maximumFractionDigits:2});
const T=n=>fa(n)+' تومان';
const E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ill=(bg,x)=>'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><rect width='200' height='200' fill='${bg}'/>${x}</svg>`);
const plate=`<ellipse cx='100' cy='112' rx='78' ry='34' fill='#fff'/><ellipse cx='100' cy='108' rx='62' ry='25' fill='#f1efe9'/>`;
const DEMO={
1:ill('#f3d9a6',plate+`<ellipse cx='100' cy='102' rx='46' ry='17' fill='#fffaf0'/><rect x='48' y='74' width='104' height='13' rx='6.5' fill='#b4512c'/><rect x='48' y='91' width='104' height='13' rx='6.5' fill='#9f4424'/><circle cx='150' cy='70' r='13' fill='#d63d2a'/><path d='M146 59q4-8 9 0' stroke='#3c7a32' stroke-width='3' fill='none'/>`),
2:ill('#f5cc92',plate+`<line x1='42' y1='100' x2='158' y2='100' stroke='#8a6a3b' stroke-width='3'/><rect x='52' y='86' width='26' height='28' rx='9' fill='#e1913b'/><rect x='82' y='86' width='26' height='28' rx='9' fill='#d9822e'/><rect x='112' y='86' width='26' height='28' rx='9' fill='#e1913b'/><circle cx='148' cy='100' r='9' fill='#d63d2a'/>`),
3:ill('#d3e6c8',`<path d='M36 82h128a64 60 0 0 1-128 0z' fill='#f4f1ea'/><ellipse cx='100' cy='82' rx='64' ry='14' fill='#3d6a2c'/><circle cx='80' cy='82' r='5' fill='#8c3a2a'/><circle cx='108' cy='85' r='5' fill='#8c3a2a'/><circle cx='126' cy='80' r='4' fill='#a8452f'/>`),
4:ill('#f1d3d4',plate+`<ellipse cx='96' cy='102' rx='44' ry='17' fill='#fffaf0'/><circle cx='78' cy='98' r='3.5' fill='#c2213a'/><circle cx='92' cy='92' r='3.5' fill='#c2213a'/><circle cx='108' cy='98' r='3.5' fill='#c2213a'/><circle cx='118' cy='90' r='3.5' fill='#c2213a'/><circle cx='100' cy='104' r='3.5' fill='#c2213a'/><rect x='118' y='86' width='40' height='26' rx='12' fill='#d98a3d'/>`),
5:ill('#d8eed0',`<path d='M40 86h120a60 56 0 0 1-120 0z' fill='#f4f1ea'/><circle cx='76' cy='82' r='14' fill='#d63d2a'/><circle cx='104' cy='78' r='14' fill='#e24c36'/><circle cx='128' cy='84' r='12' fill='#8fc46a'/><circle cx='92' cy='90' r='11' fill='#9ed07a'/><path d='M56 78q10-22 28-8' stroke='#3c8a3c' stroke-width='5' fill='none'/>`),
6:ill('#dce9f5',`<path d='M68 40h64l-8 104H76z' fill='#fbfbf6' stroke='#c4d3e1' stroke-width='3'/><path d='M71 62h58' stroke='#e9eef2' stroke-width='10'/><circle cx='100' cy='46' r='5' fill='#5fae5a'/><circle cx='88' cy='90' r='3' fill='#e4edf4'/><circle cx='108' cy='110' r='3' fill='#e4edf4'/>`),
7:ill('#f6d4d0',`<rect x='72' y='34' width='56' height='110' rx='12' fill='#c8202f'/><rect x='72' y='70' width='56' height='30' fill='#fff'/><rect x='82' y='30' width='36' height='8' rx='4' fill='#b8bec4'/><circle cx='148' cy='60' r='5' fill='#fff' opacity='.7'/><circle cx='158' cy='86' r='3' fill='#fff' opacity='.7'/>`),
8:ill('#eddcc8',`<ellipse cx='100' cy='140' rx='58' ry='12' fill='#fff'/><path d='M72 62h56l-6 72H78z' fill='#b95a1f' opacity='.9'/><path d='M72 62h56l-1 10H73z' fill='#e8b98a'/><path d='M88 50q-6-12 2-20M108 50q-6-12 2-20' stroke='#b9a58f' stroke-width='3' fill='none' stroke-linecap='round'/>`)
};
let S=null;
try{S=JSON.parse(localStorage.getItem('rest1'))}catch(e){}
if(!S)S={tables:8,orders:{},nid:100,sales:[],

inv:[{id:1,name:'گوشت چرخ‌کرده',qty:12,unit:'کیلو',min:3},{id:2,name:'مرغ',qty:15,unit:'کیلو',min:4},{id:3,name:'برنج',qty:20,unit:'کیلو',min:5},{id:4,name:'نوشابه',qty:24,unit:'عدد',min:6},{id:5,name:'دوغ',qty:18,unit:'عدد',min:6}]};

let tab='order',cur='1',cf='';
const lb=t=>typeof t=='number'?'میز '+fa(t):t;
const curLb=()=>cur=='T'?'بیرون‌بر':'میز '+fa(cur);
const cnt=o=>Object.values(o||{}).reduce((a,b)=>a+b,0);
function go(t){tab=t;render();scrollTo(0,0)}
function render(){
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 $('#main').innerHTML=(tab=='set'?'':GEAR)+({order:vOrder,tables:vTables,set:vSet,live:vLive,done:vRep})[tab]();
 $('#nb').textContent=Object.keys(S.orders).length||'';
 const o=S.orders[cur],n=cnt(o);
 $('#cartbar').innerHTML=tab=='order'&&n?`<button onclick="openOrder()"><span>${curLb()}: ${fa(n)} آیتم</span><b>${T(ordTotal(o))}</b></button>`:'';
}
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2400)}
function sheet(h){const e=$('#sh'),p=e.querySelector('.in'),st=p?p.scrollTop:0;
 e.innerHTML='<div class="in"><button class="x" onclick="closeSheet()" aria-label="بستن">✕</button>'+h+'</div>';
 e.classList.add('open');e.querySelector('.in').scrollTop=st}
function closeSheet(){const e=$('#sh');e.classList.remove('open');e.innerHTML=''}

/* order entry (home) */
function ordTotal(o){return Object.entries(o||{}).reduce((s,[id,q])=>{const m=S.menu.find(x=>x.id==id);return s+(m?m.price*q:0)},0)}
function selT(k){cur=String(k);tab='order';render();scrollTo(0,0)}
function vOrder(){
 const o=S.orders[cur]||{},cats=[...new Set(S.menu.map(m=>m.cat))];
 let h='<h1>ثبت سفارش</h1><div class="chips"><button class="ch '+(cur=='T'?'on ':'')+(S.orders.T?'dot':'')+'" onclick="selT(\'T\')">بیرون‌بر</button>';
 for(let i=1;i<=S.tables;i++)h+=`<button class="ch ${cur==i?'on':''} ${S.orders[i]?'dot':''}" onclick="selT(${i})">میز ${fa(i)}</button>`;
 h+='</div>'+custBox()+'<div class="chips"><button class="ch '+(cf?'':'on')+'" onclick="cf=\'\';render()">همه</button>'+cats.map(c=>`<button class="ch ${cf==c?'on':''}" onclick="cf=this.dataset.c;render()" data-c="${E(c)}">${E(c)}</button>`).join('')+'</div><div class="items">';
 h+=S.menu.filter(m=>!cf||m.cat==cf).map(m=>{const q=o[m.id]||0;
  return `<div class="it ${q?'sel':''}" role="button" tabindex="0" onclick="add(${m.id},1)">${m.img?`<img src="${m.img}" alt="">`:`<div class="ph">${E([...m.name][0]||'')}</div>`}<div class="cap"><b>${E(m.name)}</b><small>${T(m.price)}</small></div>${q?`<span class="bd ${an(m.id)}">${fa(q)}</span><button class="mn" onclick="event.stopPropagation();add(${m.id},-1)" aria-label="کم">−</button>`:''}</div>`}).join('');
 return h+'</div>'+(S.menu.length?'':'<p class="empty">منو خالی است. از تنظیمات، بخش منو، غذا اضافه کنید.</p>')
}
function add(id,d){const o=S.orders[cur]=S.orders[cur]||{};o[id]=(o[id]||0)+d;if(o[id]<=0)delete o[id];if(!Object.keys(o).length)delete S.orders[cur];save();render();if($('#sh').classList.contains('open'))openOrder()}
function openOrder(){
 const o=S.orders[cur]||{};
 if(!cnt(o))return closeSheet();
 const rows=Object.entries(o).map(([id,q])=>{const m=S.menu.find(x=>x.id==id);return m?`<div class="li"><div><b>${E(m.name)}</b><small>${T(m.price)}</small></div><div class="qty"><button onclick="add(${m.id},-1)" aria-label="کم">−</button><span>${fa(q)}</span><button onclick="add(${m.id},1)" aria-label="زیاد">+</button></div></div>`:''}).join('');
 sheet(`<h2>سفارش ${curLb()}</h2>${rows}<div class="tot"><span>جمع</span><b>${T(ordTotal(o))}</b></div><div class="row"><button class="pri" onclick="pay()">پرداخت و چاپ فیش</button></div><div class="row"><button class="ghost" onclick="closeSheet();go('order')">افزودن غذا</button><button class="danger" onclick="clr()">لغو سفارش</button></div>`)
}
function clr(){delete S.orders[cur];save();closeSheet();render()}
function pay(){
 const o=S.orders[cur];if(!o||!cnt(o))return;
 const items=[];let total=0;
 for(const [id,q] of Object.entries(o)){const m=S.menu.find(x=>x.id==id);if(!m)continue;
  items.push({n:m.name,q,p:m.price});total+=m.price*q;
  const v=S.inv.find(x=>x.id==m.inv);if(v)v.qty=Math.max(0,+(v.qty-m.use*q).toFixed(3))}
 const s={t:Date.now(),no:S.rn++,table:cur=='T'?'بیرون‌بر':'میز '+fa(cur),items,total};
 S.sales.push(s);delete S.orders[cur];save();render();showReceipt(s)
}

/* receipt */
function rcHTML(s){const d=new Date(s.t);
 return `<div class="rc"><h3>${E(S.name)}</h3><p>${d.toLocaleDateString('fa-IR')} - ${d.toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})}</p><p>فیش شماره ${fa(s.no||0)} | ${E(lb(s.table))}</p><table>${s.items.map(i=>`<tr><td>${E(i.n)}</td><td>×${fa(i.q)}</td><td>${fa(i.p*i.q)}</td></tr>`).join('')}</table><div class="tt"><span>جمع (تومان)</span><span>${fa(s.total)}</span></div><p style="margin-top:8px">ممنون از انتخاب شما</p></div>`}
function showReceipt(s){const h=rcHTML(s);$('#rc').innerHTML=h;
 sheet(`<h2>فیش</h2>${h}<div class="row"><button class="pri" onclick="doPrint()">چاپ فیش</button><button class="ghost" onclick="closeSheet()">بستن</button></div>`)}
function doPrint(){try{window.print()}catch(e){toast('چاپ در این نمایش ممکن نیست؛ لینک را در مرورگر باز کنید')}}
function reprint(i){showReceipt(S.sales[i])}

/* tables */
function vTables(){
 let h='<h1>میزها</h1><div class="grid">';
 for(let i=1;i<=S.tables;i++){const o=S.orders[i],n=cnt(o);
  h+=`<button class="tb ${n?'busy':''}" onclick="selT(${i})"><b>میز ${fa(i)}</b><span>${n?fa(n)+' آیتم':'خالی'}</span><span>${n?T(ordTotal(o)):''}</span></button>`}
 return h+'</div><div class="row"><button class="ghost" onclick="S.tables++;save();render()">افزودن میز</button><button class="ghost" onclick="rmTable()">حذف آخرین میز</button></div>'

/* generic form */
let FC;
function form(t,f,onSave,onDel){FC={f,onSave,onDel};
 sheet(`<h2>${t}</h2><div id="fe" class="err"></div>`+f.map(x=>`<label>${x.l}${x.o?`<select id="f_${x.k}">${x.o.map(o=>`<option value="${o[0]}" ${String(o[0])==String(x.v)?'selected':''}>${E(o[1])}</option>`).join('')}</select>`:`<input id="f_${x.k}" type="${x.t||'text'}" ${x.t=='number'?'step="any" inputmode="decimal"':''} value="${E(x.v)}">`}</label>`).join('')+`<div class="row"><button class="pri" onclick="fsave()">ذخیره</button>${onDel?'<button class="danger" onclick="fdel()">حذف</button>':''}</div>`)}
function fsave(){const d={};FC.f.forEach(x=>d[x.k]=$('#f_'+x.k).value);const e=FC.onSave(d);if(e){$('#fe').textContent=e;return}save();closeSheet();render()}

/* menu */
function vMenu(){
 return '<h1>منو</h1>'+(S.menu.map(m=>{const v=S.inv.find(x=>x.id==m.inv);
  return `<button class="li" onclick="editMenu(${m.id})">${m.img?`<img src="${m.img}" alt="" style="width:50px;height:50px;border-radius:15px;object-fit:cover">`:''}<div style="flex:1"><b>${E(m.name)}</b><small>${E(m.cat)}${v?' - هر پرس '+fa(m.use)+' '+E(v.unit)+' '+E(v.name):''}</small></div><span>${T(m.price)}</span></button>`}).join('')||'<p class="empty">هنوز غذایی اضافه نکرده‌اید.</p>')+'<button class="pri wide" onclick="editMenu()">افزودن غذا</button>'
}
function editName(){form('نام روی فیش',[{k:'n',l:'نام رستوران',v:S.name}],d=>{if(!d.n.trim())return 'نام را وارد کنید';S.name=d.n.trim()})}
function editMenu(id){
 const m=S.menu.find(x=>x.id==id)||{name:'',price:'',inv:'',use:1,cat:cf||'غذای اصلی'};
 form(id?'ویرایش غذا':'غذای جدید',[
  {k:'name',l:'نام غذا',v:m.name},
  {k:'price',l:'قیمت (تومان)',v:m.price,t:'number'},
  {k:'cat',l:'دسته‌بندی (مثلاً نوشیدنی)',v:m.cat},
  {k:'inv',l:'کسر از انبار',v:m.inv,o:[['','هیچ‌کدام'],...S.inv.map(x=>[x.id,x.name])]},
  {k:'use',l:'مقدار مصرف برای هر پرس',v:m.use,t:'number'}],
 d=>{if(!d.name.trim()||!(+d.price>0))return 'نام و قیمت غذا را وارد کنید';
  const r={id:m.id||S.nid++,name:d.name.trim(),price:+d.price,cat:d.cat.trim()||'غذای اصلی',inv:d.inv?+d.inv:'',use:+d.use||0,img:tmpImg};
  if(id)Object.assign(m,r);else S.menu.push(r)},
 id?()=>{S.menu=S.menu.filter(x=>x.id!=id);Object.values(S.orders).forEach(o=>delete o[id])}:null);
 tmpImg=m.img||'';
 $('#sh .row').insertAdjacentHTML('beforebegin','<label>عکس غذا<input type="file" accept="image/*" onchange="pickImg(this)"></label><div id="pv"></div>');
 $('#pv').innerHTML=pvHTML()
}

/* inventory */
function vInv(){
 const low=S.inv.filter(x=>x.qty<=x.min).length;
 return '<h1>انبار</h1>'+(low?`<p class="alert">${fa(low)} کالا به حد هشدار رسیده است</p>`:'')+S.inv.map(v=>`<div class="li ${v.qty<=v.min?'low':''}"><button class="nm" onclick="editInv(${v.id})"><b>${E(v.name)}</b><small>${fa(v.qty)} ${E(v.unit)}${v.qty<=v.min?' (کمتر از حد هشدار)':''}</small></button><div class="qty"><button onclick="adj(${v.id},-1)" aria-label="کم">−</button><button onclick="adj(${v.id},1)" aria-label="زیاد">+</button></div></div>`).join('')+'<button class="pri wide" onclick="editInv()">افزودن کالا</button>'
}
function adj(id,d){const v=S.inv.find(x=>x.id==id);v.qty=Math.max(0,v.qty+d);save();render()}
function editInv(id){
 const v=S.inv.find(x=>x.id==id)||{name:'',qty:0,unit:'کیلو',min:1};
 form(id?'ویرایش کالا':'کالای جدید',[
  {k:'name',l:'نام کالا',v:v.name},
  {k:'qty',l:'موجودی فعلی',v:v.qty,t:'number'},
  {k:'unit',l:'واحد (کیلو، عدد، ...)',v:v.unit},
  {k:'min',l:'حد هشدار',v:v.min,t:'number'}],
 d=>{if(!d.name.trim())return 'نام کالا را وارد کنید';
  const r={id:v.id||S.nid++,name:d.name.trim(),qty:+d.qty||0,unit:d.unit.trim()||'عدد',min:+d.min||0};
  if(id)Object.assign(v,r);else S.inv.push(r)},
 id?()=>{S.inv=S.inv.filter(x=>x.id!=id);S.menu.forEach(m=>{if(m.inv==id)m.inv=''})}:null)
}

/* food photo */
let tmpImg='';
function pvHTML(){return tmpImg?`<img src="${tmpImg}" alt="" style="width:96px;height:96px;object-fit:cover;border-radius:22px;display:block;margin:8px 0"><button class="ghost" style="padding:6px 14px" onclick="tmpImg='';$('#pv').innerHTML=pvHTML()">حذف عکس</button>`:''}
function pickImg(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=480;c.width=c.height=s;const k=Math.max(s/im.width,s/im.height),w=im.width*k,h=im.height*k;c.getContext('2d').drawImage(im,(s-w)/2,(s-h)/2,w,h);tmpImg=c.toDataURL('image/jpeg',0.8);$('#pv').innerHTML=pvHTML()};im.onerror=()=>toast('این فایل عکس معتبر نیست');im.src=r.result};r.readAsDataURL(f)}

}

}

/* report */
function vRep(){
 const d=new Date().toDateString(),td=S.sales.map((s,i)=>({...s,i})).filter(s=>new Date(s.t).toDateString()==d);
 const sum=td.reduce((x,s)=>x+s.total,0),c={};
 td.forEach(s=>s.items.forEach(i=>c[i.n]=(c[i.n]||0)+i.q));
 const top=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,5),mx=top[0]?top[0][1]:1;
 return `<h1>تسویه‌شده‌ها</h1><div class="sum"><div><small>جمع فروش</small><b>${T(sum)}</b></div><div><small>تعداد سفارش</small><b>${fa(td.length)}</b></div><div><small>میانگین هر سفارش</small><b>${T(td.length?Math.round(sum/td.length):0)}</b></div></div>`
 +'<h2>پرفروش‌ترین‌ها</h2>'+(top.map(([n,q])=>`<div class="bar"><span>${E(n)}</span><div class="tr"><i style="width:${q/mx*100}%"></i></div><em>${fa(q)}</em></div>`).join('')||'<p class="empty">امروز هنوز فروشی ثبت نشده. با «پرداخت و چاپ فیش» فروش ثبت می‌شود.</p>')
 +(td.length?'<h2>آخرین سفارش‌ها (برای چاپ دوباره بزنید)</h2>':'')+td.slice().reverse().map(s=>`<button class="li" onclick="reprint(${s.i})"><div><b>${E(lb(s.table))}</b><small>${new Date(s.t).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})}، ${s.items.map(i=>E(i.n)+' ×'+fa(i.q)).join('، ')}</small></div><span>${T(s.total)}</span></button>`).join('')
}
/* prefs, customer, kitchen, share, settled */
S.meta=S.meta||{};S.kitchen=S.kitchen||'';S.theme=S.theme||'light';S.font=S.font||'v';S.fs=S.fs||15;S.paper=S.paper||80;
const FONTS={v:['وزیر‌متن',"'Vazirmatn',Tahoma,system-ui,sans-serif"],t:['تاهوما','Tahoma,system-ui,sans-serif'],s:['سیستم',"system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"],n:['نسخ',"'Noto Naskh Arabic',Tahoma,serif"]};
function applyPrefs(){const r=document.documentElement;
 if(S.theme=='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.theme);
 document.body.style.fontFamily=(FONTS[S.font]||FONTS.v)[1];document.body.style.fontSize=S.fs+'px';
 r.style.setProperty('--rcw',S.paper==57?'215px':'300px');
 let p=document.getElementById('pg');if(!p){p=document.createElement('style');p.id='pg';document.head.appendChild(p)}
 p.textContent='@page{size:'+S.paper+'mm auto;margin:3mm}'}
function pref(){save();applyPrefs();render()}
function custBox(){const m=S.meta[cur]||{};return `<div class="cust"><input placeholder="نام مشتری" value="${E(m.name||'')}" oninput="setMeta('name',this.value)"><input placeholder="شماره موبایل" inputmode="tel" value="${E(m.phone||'')}" oninput="setMeta('phone',this.value)"></div>`}
function setMeta(f,v){const m=S.meta[cur]=S.meta[cur]||{};m[f]=v;save()}
function setNote(id,v){const m=S.meta[cur]=S.meta[cur]||{};(m.notes=m.notes||{})[id]=v;save()}
function curSale(){const o=S.orders[cur]||{},mt=S.meta[cur]||{},n=mt.notes||{},items=[];let total=0;
 for(const [id,q] of Object.entries(o)){const m=S.menu.find(x=>x.id==id);if(!m)continue;items.push({n:m.name,q,p:m.price,note:n[id]||''});total+=m.price*q}
 return {t:Date.now(),table:curLb(),items,total,cust:{name:mt.name||'',phone:mt.phone||''}}}
function openOrder(){
 const o=S.orders[cur]||{},mt=S.meta[cur]||{},n=mt.notes||{};
 if(!cnt(o))return closeSheet();
 const rows=Object.entries(o).map(([id,q])=>{const m=S.menu.find(x=>x.id==id);return m?`<div class="li" style="flex-wrap:wrap"><div><b>${E(m.name)}</b><small>${T(m.price)}</small></div><div class="qty"><button onclick="add(${m.id},-1)" aria-label="کم">−</button><span>${fa(q)}</span><button onclick="add(${m.id},1)" aria-label="زیاد">+</button></div><input class="note" placeholder="توضیحات این غذا (مثلاً بدون پیاز)" value="${E(n[id]||'')}" oninput="setNote(${m.id},this.value)"></div>`:''}).join('');
 sheet(`<h2>سفارش ${curLb()}</h2>${mt.name||mt.phone?`<small>مشتری: ${E(mt.name||'')} ${E(mt.phone||'')}</small>`:''}${rows}<div class="tot"><span>جمع</span><b>${T(ordTotal(o))}</b></div><div class="row"><button class="pri" onclick="regOrder()">ثبت سفارش</button><button class="ghost" onclick="pay()">پرداخت و چاپ فیش</button></div><div class="row"><button class="ghost" onclick="kitchenSheet()">ارسال به آشپزخانه</button><button class="ghost" onclick="closeSheet();go('order')">افزودن غذا</button></div><div class="row"><button class="danger" onclick="clr()">لغو سفارش</button></div>`)}
function clr(){delete S.orders[cur];delete S.meta[cur];save();closeSheet();render()}
function regOrder(){const m=S.meta[cur]=S.meta[cur]||{};m.reg=1;save();render();kitchenSheet(true)}
function kitchenSheet(done){sheet(`<h2>${done?'سفارش ثبت شد ✓':'ارسال به آشپزخانه'}</h2><small>${curLb()}، ${S.kitchen?'شماره آشپزخانه: '+E(S.kitchen):'شماره آشپزخانه هنوز در تنظیمات ثبت نشده'}</small><div class="row"><button class="pri" onclick="sendSMS()">ارسال پیامک</button><button class="ghost" onclick="shareImg(curSale())">اشتراک عکس فیش</button></div><div class="row"><button class="ghost" onclick="closeSheet();go('live')">سفارش‌های جاری</button></div>`)}
function kText(){const s=curSale();return s.table+(s.cust.name?' - '+s.cust.name:'')+'\n'+s.items.map(i=>i.n+' --> '+i.q+' پرس'+(i.note?' ('+i.note+')':'')).join('\n')}

function pay(){

function rcHTML(s){const d=new Date(s.t);
 return `<div class="rc"><h3>${E(S.name)}</h3><p>${d.toLocaleDateString('fa-IR')} - ${d.toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})}</p><p>${s.no?'فیش شماره '+fa(s.no)+' | ':''}${E(lb(s.table))}</p>${s.cust&&s.cust.name?`<p>مشتری: ${E(s.cust.name)}</p>`:''}<table>${s.items.map(i=>`<tr><td>${E(i.n)}${i.note?`<br><small style="color:#444">${E(i.note)}</small>`:''}</td><td>×${fa(i.q)}</td><td>${fa(i.p*i.q)}</td></tr>`).join('')}</table><div class="tt"><span>جمع (تومان)</span><span>${fa(s.total)}</span></div><p style="margin-top:8px">ممنون از انتخاب شما</p></div>`}

function delSale(i){sheet(`<h2>حذف تسویه</h2><p>این فیش از لیست و گزارش حذف می‌شود.</p><div class="row"><button class="danger" onclick="S.sales.splice(${i},1);save();closeSheet();render()">حذف شود</button><button class="ghost" onclick="closeSheet()">انصراف</button></div>`)}

function rcCanvas(s){
 const W=S.paper==57?384:576,d=new Date(s.t),ff=(FONTS[S.font]||FONTS.v)[1];
 const L=[['c',S.name,34,1],['c',d.toLocaleDateString('fa-IR')+' - '+d.toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'}),20],['c',(s.no?'فیش شماره '+fa(s.no)+' | ':'سفارش | ')+lb(s.table),22]];
 if(s.cust&&s.cust.name)L.push(['c','مشتری: '+s.cust.name,22]);
 L.push(['h']);
 s.items.forEach(i=>{L.push(['r',i.n+' ×'+fa(i.q),24,0,fa(i.p*i.q)]);if(i.note)L.push(['n',i.note,19])});
 L.push(['h'],['r','جمع (تومان)',28,1,fa(s.total)],['c','ممنون از انتخاب شما',20]);
 const H=Math.ceil(L.reduce((a,x)=>a+(x[0]=='h'?22:x[2]*1.7),0)+40),c=document.createElement('canvas');c.width=W;c.height=H;
 const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,W,H);g.fillStyle='#000';g.direction='rtl';g.textBaseline='middle';
 let y=20;
 L.forEach(x=>{if(x[0]=='h'){g.fillRect(16,y+10,W-32,2);y+=22;return}
  const h=x[2]*1.7;g.font=(x[3]?'700 ':'400 ')+x[2]+'px '+ff;
  if(x[0]=='c'){g.textAlign='center';g.fillText(x[1],W/2,y+h/2)}
  else if(x[0]=='n'){g.textAlign='right';g.fillStyle='#555';g.fillText(x[1],W-20,y+h/2);g.fillStyle='#000'}
  else{g.textAlign='right';g.fillText(x[1],W-20,y+h/2);g.textAlign='left';g.fillText(x[4],20,y+h/2)}
  y+=h});
 return c}
function shareImg(s){if(!s)return;rcCanvas(s).toBlob(async b=>{const f=new File([b],'receipt.png',{type:'image/png'});

 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='receipt.png';a.click();toast('عکس فیش ذخیره شد؛ از گالری برای تلگرام بفرستید')},'image/png')}

function vRep(){
 const d=new Date().toDateString(),all=S.sales.map((s,i)=>({...s,i})),td=all.filter(s=>new Date(s.t).toDateString()==d);
 const sum=td.reduce((x,s)=>x+s.total,0),c={};
 td.forEach(s=>s.items.forEach(i=>c[i.n]=(c[i.n]||0)+i.q));
 const top=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,5),mx=top[0]?top[0][1]:1;
 return `<h1>تسویه‌شده‌ها</h1><div class="sum"><div><small>فروش امروز</small><b>${T(sum)}</b></div><div><small>تعداد سفارش</small><b>${fa(td.length)}</b></div><div><small>میانگین هر سفارش</small><b>${T(td.length?Math.round(sum/td.length):0)}</b></div></div>`
 +(top.length?'<h2>پرفروش‌های امروز</h2>':'')+top.map(([n,q])=>`<div class="bar"><span>${E(n)}</span><div class="tr"><i style="width:${q/mx*100}%"></i></div><em>${fa(q)}</em></div>`).join('')
 +(all.length?'<h2>همه تسویه‌ها (برای فیش، اشتراک یا حذف بزنید)</h2>':'<p class="empty">هنوز سفارش تسویه‌شده‌ای ندارید.</p>')

function liveList(){
 let a=Object.keys(S.orders).map(k=>({k,o:S.orders[k],m:S.meta[k]||{}}));const q=nd(lQ.trim().toLowerCase());
 if(q)a=a.filter(x=>nd((x.k=='T'?'بیرون بر':'میز '+x.k)+' '+(x.m.name||'')+' '+(x.m.phone||'')+' '+Object.keys(x.o).map(id=>(S.menu.find(y=>y.id==id)||{}).name||'').join(' ')).toLowerCase().includes(q));
 a.sort((x,y)=>lS=='max'?grand(y.k)-grand(x.k):(y.m.t||0)-(x.m.t||0));
 return a.map(x=>`<button class="li" onclick="cur='${x.k}';openOrder()"><div><b>${x.k=='T'?'بیرون‌بر':'میز '+fa(x.k)}${x.m.name?' - '+E(x.m.name):''}</b><small>${fa(cnt(x.o))} آیتم${x.m.reg?' - ثبت‌شده':' - ثبت‌نشده'}${x.m.phone?' - '+E(x.m.phone):''}</small></div><span>${T(grand(x.k))}</span></button>`).join('')||'<p class="empty">موردی پیدا نشد.</p>'}
function vLive(){return '<h1>سفارش‌های جاری</h1>'+bar('l')+'<div id="lst">'+liveList()+'</div>'}
function doneList(){
 let a=S.sales.map((s,i)=>({...s,i}));const q=nd(dQ.trim().toLowerCase());
 if(q)a=a.filter(s=>nd([lb(s.table),s.cust&&s.cust.name,s.cust&&s.cust.phone,s.no,new Date(s.t).toLocaleDateString('fa-IR'),...s.items.map(i=>i.n)].join(' ')).toLowerCase().includes(q));
 a.sort((x,y)=>dS=='max'?y.total-x.total:y.t-x.t);
 return a.map(s=>{const t=new Date(s.t);return `<button class="li" onclick="reprint(${s.i})"><div><b>${E(lb(s.table))}${s.cust&&s.cust.name?' - '+E(s.cust.name):''}</b><small>${t.toLocaleDateString('fa-IR')} ${t.toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})}، ${s.items.map(i=>E(i.n)+' ×'+fa(i.q)).join('، ')}</small></div><span>${T(s.total)}</span></button>`}).join('')||'<p class="empty">موردی پیدا نشد.</p>'}
function vRep(){
 const d=new Date().toDateString(),td=S.sales.filter(s=>new Date(s.t).toDateString()==d),sum=td.reduce((x,s)=>x+s.total,0),c={};
 td.forEach(s=>s.items.forEach(i=>c[i.n]=(c[i.n]||0)+i.q));
 const top=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,5),mx=top[0]?top[0][1]:1;
 return `<h1>تسویه‌شده‌ها</h1><div class="sum"><div><small>فروش امروز</small><b>${T(sum)}</b></div><div><small>تعداد سفارش</small><b>${fa(td.length)}</b></div><div><small>میانگین هر سفارش</small><b>${T(td.length?Math.round(sum/td.length):0)}</b></div></div>`
 +(top.length?'<h2>پرفروش‌های امروز</h2>':'')+top.map(([n,q])=>`<div class="bar"><span>${E(n)}</span><div class="tr"><i style="width:${q/mx*100}%"></i></div><em>${fa(q)}</em></div>`).join('')
 +'<h2>همه تسویه‌ها</h2>'+bar('d')+'<div id="lst">'+doneList()+'</div>'+(S.sales.length?'<button class="danger wide" onclick="delAll()">حذف همه تسویه‌شده‌ها</button>':'')}
function editFee(k){const N={svc:'حق سرویس',tk:'بیرون‌بر',vat:'ارزش افزوده'};
 form(N[k],[{k:'p',l:'درصد (٪)',v:S.fees[k+'P'],t:'number'},{k:'a',l:'مبلغ ثابت (تومان)',v:S.fees[k+'A'],t:'number'}],d=>{S.fees[k+'P']=Math.max(0,+d.p||0);S.fees[k+'A']=Math.max(0,+d.a||0)})}
function editAddr(){form('آدرس روی فیش',[{k:'a',l:'آدرس رستوران',v:S.addr}],d=>{S.addr=d.a.trim()})}
function vSet(){
 const TH=[['light','مدرن'],['ios','ایفون'],['classic','کلاسیک'],['plain','روشن'],['dark','تیره'],['auto','خودکار']];
 const fl=f=>fa(S.fees[f+'P'])+'٪ + '+T(S.fees[f+'A']);
 let b;
 if(st=='menu')b=vMenu();else if(st=='inv')b=vInv();
 else if(st=='look')b=`<h2>تم</h2><div class="chips wrapc">${TH.map(([k,n])=>`<button class="ch ${S.theme==k?'on':''}" onclick="S.theme='${k}';pref()">${n}</button>`).join('')}</div><h2>فونت</h2><div class="chips wrapc">${Object.entries(FONTS2).map(([k,f])=>`<button class="ch ${S.font==k?'on':''}" onclick="S.font='${k}';pref()">${f[0]}</button>`).join('')}</div><small>یکان، ایران‌سنس و هما فقط وقتی کار می‌کنند که فایل فونتشان کنار index.html آپلود شده باشد.</small><h2>وزن فونت</h2><div class="chips">${[[300,'سبک'],[400,'معمولی'],[700,'ضخیم']].map(([w,n])=>`<button class="ch ${S.fw==w?'on':''}" onclick="S.fw=${w};pref()">${n}</button>`).join('')}</div><h2>اندازه متن: ${fa(S.fs)}</h2><div class="row"><button class="ghost" onclick="S.fs=Math.max(12,S.fs-1);pref()">−</button><button class="ghost" onclick="S.fs=Math.min(20,S.fs+1);pref()">+</button></div>`;
 else if(st=='fee')b=`<h2>حق سرویس</h2><button class="ghost wide" onclick="editFee('svc')">${fl('svc')}</button><h2>بیرون‌بر</h2><button class="ghost wide" onclick="editFee('tk')">${fl('tk')}</button><h2>ارزش افزوده</h2><button class="ghost wide" onclick="editFee('vat')">${fl('vat')}</button><small style="margin-top:10px">درصد و مبلغ ثابت با هم جمع می‌شوند. بیرون‌بر فقط برای سفارش «بیرون‌بر» اعمال می‌شود و ارزش افزوده روی جمع اقلام + سرویس + بیرون‌بر حساب می‌شود.</small>`;
 else b=`<h2>اندازه فیش</h2><div class="chips"><button class="ch ${S.paper==57?'on':''}" onclick="S.paper=57;pref()">۵۷ میلی‌متر</button><button class="ch ${S.paper==80?'on':''}" onclick="S.paper=80;pref()">۸۰ میلی‌متر</button></div><h2>نام روی فیش</h2><button class="ghost wide" onclick="editName()">${E(S.name)}</button><h2>آدرس روی فیش</h2><button class="ghost wide" onclick="editAddr()">${E(S.addr||'ثبت نشده')}</button><h2>آشپزخانه</h2><button class="ghost wide" onclick="editKitchen()">شماره پیامک: ${E(S.kitchen||'ثبت نشده')}</button>`;
 return '<h1>تنظیمات</h1><div class="chips">'+[['menu','منو'],['inv','انبار'],['look','ظاهر'],['fee','فاکتور'],['rc','فیش']].map(([k,n])=>`<button class="ch ${st==k?'on':''}" onclick="st='${k}';render()">${n}</button>`).join('')+'</div>'+b}
function splash(){const e=$('#splash');if(!e)return;$('#spt').innerHTML=S.name.split(' ').map((w,i)=>`<span style="animation-delay:${.3+i*.2}s">${E(w)}</span>`).join(' ');setTimeout(()=>{e.classList.add('out');setTimeout(()=>e.remove(),800)},2500)}
applyPrefs();splash();render();
</script>
</body>
</html>
