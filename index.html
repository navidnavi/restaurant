.pri,.cart button,.ch.on,.tot{background:var(--btn-bg,var(--ok))}
.pri,.ghost,.danger,.imgbtn{border-radius:var(--btn-r,14px)}

.imgbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:8px;padding:14px;border-radius:14px;font-weight:600}

.sp path{stroke-dasharray:130;stroke-dashoffset:130;animation:draw .9s .7s ease forwards}

@keyframes rise{to{opacity:1;transform:none;filter:none}}

<body>
<div id="splash"><div class="sp"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40"/><path d="M38 30v14a5 5 0 0 0 10 0V30M43 30v32M60 30c-6 4-6 14 0 18v14"/></svg><div id="spt"></div><div class="ld"><i></i></div><div class="lt">در حال آماده‌سازی<b>.</b><b>.</b><b>.</b></div></div></div>
<div id="main"></div>
<div id="cartbar" class="cart"></div>
<nav>
<button data-t="tables" onclick="go('tables')"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>میزها</button>

<script>
const $=s=>document.querySelector(s);
const fa=n=>Number(n).toLocaleString('fa-IR',{maximumFractionDigits:2});
const T=n=>fa(n)+' تومان';
const E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ill=(bg,x)=>'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><rect width='200' height='200' fill='${bg}'/>${x}</svg>`);
const plate=`<ellipse cx='100' cy='112' rx='78' ry='34' fill='#fff'/><ellipse cx='100' cy='108' rx='62' ry='25' fill='#f1efe9'/>`;
const DEMO={
1:ill('#f3d9a6',plate+`<ellipse cx='100' cy='102' rx='46' ry='17' fill='#fffaf0'/><rect x='48' y='74' width='104' height='13' rx='6.5' fill='#b4512c'/><rect x='48' y='91' width='104' height='13' rx='6.5' fill='#9f4424'/><circle cx='150' cy='70' r='13' fill='#d63d2a'/><path d='M146 59q4-8 9 0' stroke='#3c7a32' stroke-width='3' fill='none'/>`),
2:ill('#f5cc92',plate+`<line x1='42' y1='100' x2='158' y2='100' stroke='#8a6a3b' stroke-width='3'/><rect x='52' y='86' width='26' height='28' rx='9' fill='#e1913b'/><rect x='82' y='86' width='26' height='28' rx='9' fill='#d9822e'/><rect x='112' y='86' width='26' height='28' rx='9' fill='#e1913b'/><circle cx='148' cy='100' r='9' fill='#d63d2a'/>`),
3:ill('#d3e6c8',`<path d='M36 82h128a64 60 0 0 1-128 0z' fill='#f4f1ea'/><ellipse cx='100' cy='82' rx='64' ry='14' fill='#3d6a2c'/><circle cx='80' cy='82' r='5' fill='#8c3a2a'/><circle cx='108' cy='85' r='5' fill='#8c3a2a'/><circle cx='126' cy='80' r='4' fill='#a8452f'/>`),
4:ill('#f1d3d4',plate+`<ellipse cx='96' cy='102' rx='44' ry='17' fill='#fffaf0'/><circle cx='78' cy='98' r='3.5' fill='#c2213a'/><circle cx='92' cy='92' r='3.5' fill='#c2213a'/><circle cx='108' cy='98' r='3.5' fill='#c2213a'/><circle cx='118' cy='90' r='3.5' fill='#c2213a'/><circle cx='100' cy='104' r='3.5' fill='#c2213a'/><rect x='118' y='86' width='40' height='26' rx='12' fill='#d98a3d'/>`),
5:ill('#d8eed0',`<path d='M40 86h120a60 56 0 0 1-120 0z' fill='#f4f1ea'/><circle cx='76' cy='82' r='14' fill='#d63d2a'/><circle cx='104' cy='78' r='14' fill='#e24c36'/><circle cx='128' cy='84' r='12' fill='#8fc46a'/><circle cx='92' cy='90' r='11' fill='#9ed07a'/><path d='M56 78q10-22 28-8' stroke='#3c8a3c' stroke-width='5' fill='none'/>`),
6:ill('#dce9f5',`<path d='M68 40h64l-8 104H76z' fill='#fbfbf6' stroke='#c4d3e1' stroke-width='3'/><path d='M71 62h58' stroke='#e9eef2' stroke-width='10'/><circle cx='100' cy='46' r='5' fill='#5fae5a'/><circle cx='88' cy='90' r='3' fill='#e4edf4'/><circle cx='108' cy='110' r='3' fill='#e4edf4'/>`),
7:ill('#f6d4d0',`<rect x='72' y='34' width='56' height='110' rx='12' fill='#c8202f'/><rect x='72' y='70' width='56' height='30' fill='#fff'/><rect x='82' y='30' width='36' height='8' rx='4' fill='#b8bec4'/><circle cx='148' cy='60' r='5' fill='#fff' opacity='.7'/><circle cx='158' cy='86' r='3' fill='#fff' opacity='.7'/>`),
8:ill('#eddcc8',`<ellipse cx='100' cy='140' rx='58' ry='12' fill='#fff'/><path d='M72 62h56l-6 72H78z' fill='#b95a1f' opacity='.9'/><path d='M72 62h56l-1 10H73z' fill='#e8b98a'/><path d='M88 50q-6-12 2-20M108 50q-6-12 2-20' stroke='#b9a58f' stroke-width='3' fill='none' stroke-linecap='round'/>`)
};
let S=null;
try{S=JSON.parse(localStorage.getItem('rest1'))}catch(e){}
if(!S)S={tables:8,orders:{},nid:100,sales:[],
menu:[{id:1,name:'چلوکباب کوبیده',price:250000,inv:1,use:0.2,cat:'غذای اصلی'},{id:2,name:'جوجه‌کباب',price:230000,inv:2,use:0.25,cat:'غذای اصلی'},{id:3,name:'قورمه‌سبزی',price:200000,inv:3,use:0.15,cat:'غذای اصلی'},{id:4,name:'زرشک‌پلو با مرغ',price:190000,inv:2,use:0.25,cat:'غذای اصلی'},{id:5,name:'سالاد شیرازی',price:40000,inv:'',use:0,cat:'پیش‌غذا'},{id:6,name:'دوغ',price:25000,inv:5,use:1,cat:'نوشیدنی'},{id:7,name:'نوشابه',price:20000,inv:4,use:1,cat:'نوشیدنی'},{id:8,name:'چای',price:15000,inv:'',use:0,cat:'نوشیدنی'}],
inv:[{id:1,name:'گوشت چرخ‌کرده',qty:12,unit:'کیلو',min:3},{id:2,name:'مرغ',qty:15,unit:'کیلو',min:4},{id:3,name:'برنج',qty:20,unit:'کیلو',min:5},{id:4,name:'نوشابه',qty:24,unit:'عدد',min:6},{id:5,name:'دوغ',qty:18,unit:'عدد',min:6}]};
S.menu.forEach(m=>m.cat=m.cat||'غذای اصلی');S.rn=S.rn||1;S.name=S.name||'رستوران من';
if(!S.demo){S.menu.forEach(m=>{if(!m.img&&DEMO[m.id])m.img=DEMO[m.id]});S.demo=1}
let _sv=0;const flush=()=>{clearTimeout(_sv);_sv=0;try{localStorage.setItem('rest1',JSON.stringify(S))}catch(e){toast('حافظه پر است؛ تعداد عکس‌ها را کم کنید')}};
const save=()=>{if(!_sv)_sv=setTimeout(flush,300)};
try{window.addEventListener('pagehide',flush)}catch(e){}try{document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()})}catch(e){}
let tab='order',cur='1',cf='';
const lb=t=>typeof t=='number'?'میز '+fa(t):t;
const curLb=()=>lblOf(cur);
const cnt=o=>Object.values(o||{}).reduce((a,b)=>a+b,0);
function go(t){tab=t;render();scrollTo(0,0)}
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2400)}
function sheet(h){const e=$('#sh'),p=e.querySelector('.in'),st=p?p.scrollTop:0;
 e.innerHTML='<div class="in"><button class="x" onclick="closeSheet()" aria-label="بستن">✕</button>'+h+'</div>';
 e.classList.add('open');e.querySelector('.in').scrollTop=st}

/* order entry (home) */
function ordTotal(o){return Object.entries(o||{}).reduce((s,[id,q])=>{const m=S.menu.find(x=>x.id==id);return s+(m?m.price*q:0)},0)}

/* receipt */
function doPrint(){try{window.print()}catch(e){toast('چاپ در این نمایش ممکن نیست؛ لینک را در مرورگر باز کنید')}}
function reprint(i){showReceipt(S.sales[i])}

/* tables */
function rmTable(){if(S.tables<=1)return;if(S.orders[S.tables])return toast('میز آخر سفارش باز دارد');if(cur==S.tables)cur='1';S.tables--;save();render()}

/* generic form */
let FC;
function form(t,f,onSave,onDel){FC={f,onSave,onDel};
 sheet(`<h2>${t}</h2><div id="fe" class="err"></div>`+f.map(x=>`<label>${x.l}${x.o?`<select id="f_${x.k}">${x.o.map(o=>`<option value="${o[0]}" ${String(o[0])==String(x.v)?'selected':''}>${E(o[1])}</option>`).join('')}</select>`:`<input id="f_${x.k}" type="${x.t||'text'}" ${x.t=='number'?'step="any" inputmode="decimal"':''} value="${E(x.v)}">`}</label>`).join('')+`<div class="row"><button class="pri" onclick="fsave()">ذخیره</button>${onDel?'<button class="danger" onclick="fdel()">حذف</button>':''}</div>`)}
function fsave(){const d={};FC.f.forEach(x=>d[x.k]=$('#f_'+x.k).value);const e=FC.onSave(d);if(e){$('#fe').textContent=e;return}save();closeSheet();render()}
function fdel(){FC.onDel();save();closeSheet();render()}

/* menu */
function editName(){form('نام روی فیش',[{k:'n',l:'نام رستوران',v:S.name}],d=>{if(!d.n.trim())return 'نام را وارد کنید';S.name=d.n.trim()})}

/* inventory */
function vInv(){
 const low=S.inv.filter(x=>x.qty<=x.min).length;
 return '<h1>انبار</h1>'+(low?`<p class="alert">${fa(low)} کالا به حد هشدار رسیده است</p>`:'')+S.inv.map(v=>`<div class="li ${v.qty<=v.min?'low':''}"><button class="nm" onclick="editInv(${v.id})"><b>${E(v.name)}</b><small>${fa(v.qty)} ${E(v.unit)}${v.qty<=v.min?' (کمتر از حد هشدار)':''}</small></button><div class="qty"><button onclick="adj(${v.id},-1)" aria-label="کم">−</button><button onclick="adj(${v.id},1)" aria-label="زیاد">+</button></div></div>`).join('')+'<button class="pri wide" onclick="editInv()">افزودن کالا</button>'
}
function adj(id,d){const v=S.inv.find(x=>x.id==id);v.qty=Math.max(0,v.qty+d);save();render()}
function editInv(id){
 const v=S.inv.find(x=>x.id==id)||{name:'',qty:0,unit:'کیلو',min:1};
 form(id?'ویرایش کالا':'کالای جدید',[
  {k:'name',l:'نام کالا',v:v.name},
  {k:'qty',l:'موجودی فعلی',v:v.qty,t:'number'},
  {k:'unit',l:'واحد (کیلو، عدد، ...)',v:v.unit},
  {k:'min',l:'حد هشدار',v:v.min,t:'number'}],
 d=>{if(!d.name.trim())return 'نام کالا را وارد کنید';
  const r={id:v.id||S.nid++,name:d.name.trim(),qty:+d.qty||0,unit:d.unit.trim()||'عدد',min:+d.min||0};
  if(id)Object.assign(v,r);else S.inv.push(r)},
 id?()=>{S.inv=S.inv.filter(x=>x.id!=id);S.menu.forEach(m=>{if(m.inv==id)m.inv=''})}:null)
}

/* food photo */
let tmpImg='';
function pvHTML(){return tmpImg?`<img src="${tmpImg}" alt="" style="width:96px;height:96px;object-fit:cover;border-radius:22px;display:block;margin:8px 0"><button class="ghost" style="padding:6px 14px" onclick="tmpImg='';$('#pv').innerHTML=pvHTML()">حذف عکس</button>`:''}

/* settings + live orders */
let st='menu';
const GEAR='<button class="gear" onclick="go(\'set\')" aria-label="تنظیمات"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>';

/* report */

  return `<div class="it ${q?'sel':''}" role="button" tabindex="0" onclick="add(${m.id},1)">${m.img?`<img decoding="async" src="${imgSrc(m)}" alt="">`:`<div class="ph">${E([...m.name][0]||'')}</div>`}<div class="cap"><b>${E(m.name)}</b><small>${T(m.price)}</small></div>${m.img&&m.eye!==false?`<button class="eye" onclick="event.stopPropagation();zoomImg(${m.id})" aria-label="نمایش عکس"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>`:''}${q?`<span class="bd ${a?'pulse':''}"><span class="dg ${a=='up'?'dgu':a=='dn'?'dgd':''}">${fa(q)}</span></span><button class="mn" onclick="event.stopPropagation();add(${m.id},-1)" aria-label="کم">−</button>`:''}</div>`}).join('');
 return h+'</div>'+(S.menu.length?'':'<p class="empty">منو خالی است. از تنظیمات، بخش منو، غذا اضافه کنید.</p>')}
function curSale(){const o=S.orders[cur]||{},mt=S.meta[cur]||{},n=mt.notes||{},items=[];let sub=0;
 for(const [id,q] of Object.entries(o)){const m=S.menu.find(x=>x.id==id);if(!m)continue;items.push({n:m.name,q,p:m.price,note:n[id]||'',u:m.unit||'پرس'});sub+=m.price*q}
 const ex=exOf(cur);if(ex){items.push({n:'درخواست اضافه',q:1,p:ex,note:'',u:'',x:1});sub+=ex}
 const c=calc(sub,isTk(cur));
 return {t:Date.now(),table:curLb(),items,sub:c.sub,svc:c.svc,tk:c.tk,vat:c.vat,total:c.total,cust:{name:mt.name||'',phone:mt.phone||''}}}
function kText(){const s=curSale();return s.table+(s.cust.name?' '+s.cust.name:'')+'\n'+s.items.filter(i=>!i.x).map(i=>i.n+'  ←  '+i.q+' '+(i.u||'پرس')+(i.note?' ('+i.note+')':'')).join('\n')}
function totHTML(){const o=S.orders[cur]||{},base=ordTotal(o),ex=exOf(cur),c=calc(base+ex,isTk(cur)),fr=(l,v)=>v?`<div class="fr"><span>${l}</span><span>${T(v)}</span></div>`:'';
 return (c.total!=base?fr('جمع اقلام',base)+fr('درخواست اضافه',ex)+fr('حق سرویس',c.svc)+fr('بیرون‌بر',c.tk)+fr('ارزش افزوده',c.vat):'')+`<div class="tot"><span>مبلغ قابل پرداخت</span><b>${T(c.total)}</b></div>`}
function setExP(v){(S.meta[cur]=S.meta[cur]||{}).exP=Math.max(0,+v||0);save();const t=$('#tt');if(t)t.innerHTML=totHTML();const b=document.querySelector('#cartbar b');if(b)b.textContent=T(grand(cur))}
function custBox(){const m=S.meta[cur]||{};return `<div class="cust"><input placeholder="نام مشتری" value="${E(m.name||'')}" oninput="setMeta('name',this.value)"><input placeholder="شماره موبایل" inputmode="tel" value="${E(m.phone||'')}" oninput="setMeta('phone',this.value)"><button class="exb ${m.exP?'hasn':''}" onclick="editExtra()" aria-label="درخواست اضافه"><svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/></svg></button></div>`}
function editExtra(){const m=S.meta[cur]||{};form('درخواست اضافه',[{k:'e',l:'مبلغ (تومان)',v:m.exP||'',t:'number'}],d=>{(S.meta[cur]=S.meta[cur]||{}).exP=Math.max(0,+d.e||0)})}
openOrder=function(){
 const o=S.orders[cur]||{},mt=S.meta[cur]||{},n=mt.notes||{};
 if(!cnt(o))return closeSheet();
 const rows=Object.entries(o).map(([id,q])=>{const m=S.menu.find(x=>x.id==id);if(!m)return'';const op=noteOpen[id];
  return `<div class="li" style="flex-wrap:wrap"><div style="display:flex;align-items:center;gap:10px;flex:1"><button class="chev ${op?'open':''} ${n[id]?'hasn':''}" onclick="togNote(${m.id})" aria-label="توضیحات"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>${m.img?`<img class="th" decoding="async" src="${imgSrc(m)}" alt="">`:''}<div><b>${E(m.name)}</b><small>${T(m.price)}${n[id]&&!op?' - '+E(n[id]):''}</small></div></div><div class="qty"><button onclick="add(${m.id},-1)" aria-label="کم">−</button><span class="${an(m.id)}">${fa(q)}</span><button onclick="add(${m.id},1)" aria-label="زیاد">+</button></div>${op?`<input class="note" id="nt${m.id}" value="${E(n[id]||'')}" oninput="setNote(${m.id},this.value)">`:''}</div>`}).join('');
 sheet(`<h2>سفارش ${E(curLb())}</h2>${mt.name||mt.phone?`<small>مشتری: ${E(mt.name||'')} ${E(mt.phone||'')}</small>`:''}${rows}<label>درخواست اضافه (تومان)<input type="number" inputmode="numeric" value="${mt.exP||''}" oninput="setExP(this.value)"></label><div id="tt">${totHTML()}</div><div class="row"><button class="ghost" onclick="addMore()">افزودن غذا</button><button class="ghost" onclick="pay()">صدور فیش</button></div><div class="row"><button class="ghost" onclick="kitchenSheet()">ارسال به آشپزخانه</button><button class="ghost" onclick="sendCust(cur)">ارسال به مشتری</button></div><div class="row"><button class="danger" onclick="clr()">لغو سفارش</button></div>`)};
function showBill(s){const h=rcHTML(s),k=cur;$('#rc').innerHTML=h;
 sheet(`<h2>فیش</h2>${h}<div class="row"><button class="pri" onclick="doPrint()">چاپ فیش</button><button class="ghost" onclick="shareImg(wk('${k}',()=>{const x=curSale();x.no=S.rn;return x}))">اشتراک عکس</button></div><div class="row"><button class="ghost" onclick="sendCust('${k}')">ارسال به مشتری</button></div><div class="row"><button class="paid" onclick="settle('${k}')">پرداخت شده</button></div>`)}
let custTxt='';
function sText2(s){const d=new Date(s.t),L=[S.name];if(S.addr)L.push(S.addr);
 L.push(d.toLocaleDateString('fa-IR')+' '+d.toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'}),(s.no?'فیش شماره '+fa(s.no)+' | ':'')+lb(s.table),'');
 s.items.forEach(i=>L.push(i.n+'  '+(i.x?'':fa(i.q)+' '+(i.u||'')+'  ')+fa(i.p*i.q)));
 L.push('');if(s.sub!=null&&(s.svc||s.tk||s.vat))[['جمع اقلام',s.sub],['حق سرویس',s.svc],['بیرون‌بر',s.tk],['ارزش افزوده',s.vat]].forEach(([l,v])=>{if(v)L.push(l+': '+fa(v))});
 L.push('مبلغ قابل پرداخت: '+fa(s.total)+' تومان','ممنون از انتخاب شما');return L.join('\n')}
function smsHref(p,t){return 'sms:'+normPh(p)+(/iPhone|iPad/.test(navigator.userAgent)?'&':'?')+'body='+encodeURIComponent(t)}
function cphUp(k,v){(S.meta[k]=S.meta[k]||{}).phone=v;save();const a=$('#cl');if(a)a.href=smsHref(v,custTxt)}
function copyTxt(t){function fb(){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('متن کپی شد')}catch(e){toast('کپی نشد')}a.remove()}try{navigator.clipboard.writeText(t).then(()=>toast('متن کپی شد'),fb)}catch(e){fb()}}
function sendCust(k){const s=wk(k,()=>{const x=curSale();x.no=S.rn;return x}),ph=(S.meta[k]||{}).phone||'';custTxt=sText2(s);
 sheet(`<h2>ارسال فیش به مشتری</h2><label>شماره موبایل مشتری<input id="cph" type="tel" inputmode="tel" value="${E(ph)}" oninput="cphUp('${k}',this.value)"></label><div class="rc" style="white-space:pre-line;text-align:start;margin-top:12px">${E(custTxt)}</div><div class="row"><a id="cl" class="pri lnk" href="${smsHref(ph,custTxt)}">ارسال پیامک</a><button class="ghost" onclick="copyTxt(custTxt)">کپی متن</button></div>`)}
function render(){
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 $('#main').innerHTML=(tab=='set'?FSBTN:GEAR)+({order:vOrder,tables:vTables,set:vSet,live:vLive,done:vRep})[tab]();
 $('#nb').textContent=Object.keys(S.orders).length||'';
 const n=cnt(S.orders[cur]);
 $('#cartbar').innerHTML=tab=='order'&&n?`<div class="cb"><button onclick="openOrder()"><span>${E(curLb())}: ${fa(n)} آیتم</span><b>${T(grand(cur))}</b></button><button class="cbg" onclick="regOrder()">ثبت سفارش</button></div>`:''}
function addList(t,title){form(title,[{k:'v',l:'نام',v:''}],d=>{const x=d.v.trim();if(!x)return 'نام را وارد کنید';if(!S[t].includes(x))S[t].push(x)})}
let topOpen=false;
function bar(k){const sv=k=='l'?lS:dS,q=k=='l'?lQ:dQ;
 return `<div class="chips"><button class="ch ${sv=='new'?'on':''}" onclick="${k}S='new';render()">جدیدترین</button><button class="ch ${sv=='max'?'on':''}" onclick="${k}S='max';render()">بیشترین مبلغ</button></div><input type="search" placeholder="جستجو" value="${E(q)}" oninput="${k}Q=this.value;$('#lst').innerHTML=${k=='l'?'liveList':'doneList'}()" style="margin:0 0 6px">`}
function vRep(){
 const d=new Date().toDateString(),td=S.sales.filter(s=>new Date(s.t).toDateString()==d&&s.st!='cancel'),sum=td.reduce((x,s)=>x+s.total,0),c={};
 td.forEach(s=>s.items.forEach(i=>{if(!i.x)c[i.n]=(c[i.n]||0)+i.q}));
 const top=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,30),mx=top[0]?top[0][1]:1;
 return `<h1>تسویه‌شده‌ها</h1><details class="nd" ${topOpen?'open':''} ontoggle="topOpen=this.open"><summary>آمار فروش امروز</summary><div class="sum" style="margin-top:8px"><div><small>فروش امروز</small><b>${T(sum)}</b></div><div><small>تعداد سفارش</small><b>${fa(td.length)}</b></div><div><small>میانگین هر سفارش</small><b>${T(td.length?Math.round(sum/td.length):0)}</b></div></div>
  ${top.length?`<h2>پرفروش‌ترین‌ها</h2><div style="max-height:260px;overflow:auto">${top.map(([n,q])=>`<div class="bar"><span>${E(n)}</span><div class="tr"><i style="width:${q/mx*100}%"></i></div><em>${fa(q)}</em></div>`).join('')}</div>`:'<p class="empty">امروز هنوز فروشی ثبت نشده.</p>'}</details>`
 +'<h2>همه تسویه‌ها</h2>'+bar('d')+'<div id="lst">'+doneList()+'</div>'+(S.sales.length?'<button class="danger wide" onclick="delAll()">حذف همه تسویه‌شده‌ها</button>':'')}
/* v10 */
S.cols=S.cols==3?3:2;
const ICO=n=>'<svg viewBox="0 0 24 24">'+(n==3?'<rect x="3" y="3" width="5" height="18" rx="1.5"/><rect x="9.5" y="3" width="5" height="18" rx="1.5"/><rect x="16" y="3" width="5" height="18" rx="1.5"/>':'<rect x="3.5" y="3" width="7.5" height="18" rx="2"/><rect x="13" y="3" width="7.5" height="18" rx="2"/>')+'</svg>';
const vo0=vOrder;vOrder=function(){return `<button class="gear colbtn" onclick="S.cols=S.cols==2?3:2;save();render()" aria-label="تعداد ستون">${ICO(S.cols==2?3:2)}</button>`+vo0().replace('<div class="items">','<div class="items c'+S.cols+'">')};
const FSBTN='<button class="gear" onclick="fsToggle()" aria-label="تمام‌صفحه"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>';
function fsToggle(){const bad=()=>toast('تمام‌صفحه در این حالت پشتیبانی نمی‌شود');try{if(!document.fullscreenElement){const r=document.documentElement.requestFullscreen();if(r&&r.catch)r.catch(bad)}else document.exitFullscreen()}catch(e){bad()}}
const VER='v11';
const vs4=vSet;vSet=function(){let h=vs4();if(st=='look')h+=`<h2>نسخه برنامه: ${VER}</h2><button class="ghost wide" onclick="hardRefresh()">به‌روزرسانی برنامه</button><small style="margin-top:6px">اطلاعات منو، سفارش‌ها و فروش پاک نمی‌شود. فقط نسخه‌ی ذخیره‌شده‌ی برنامه دوباره از اینترنت گرفته می‌شود.</small>`;return h};
async function hardRefresh(){toast('در حال به‌روزرسانی…');flush();try{if(navigator.serviceWorker)for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister();if(window.caches)for(const k of await caches.keys())await caches.delete(k)}catch(e){}location.href=location.pathname+'?u='+Date.now()}
/* v12 */
S.glass=Object.assign({on:false,sc:'#fafbfd',sa:84,sb:30,bc:'#ffffff',ba:60,bb:0},S.glass);
const hexA=(h,a)=>{const n=parseInt(h.slice(1),16);return 'rgba('+(n>>16)+','+(n>>8&255)+','+(n&255)+','+a/100+')'};
function applyGlass(){const s=document.documentElement.style,g=S.glass;['--sheet-c','--sheet-bf','--bg-c','--bg-bf'].forEach(v=>s.removeProperty(v));if(!g.on)return;s.setProperty('--sheet-c',hexA(g.sc,g.sa));s.setProperty('--sheet-bf','blur('+g.sb+'px) saturate(180%)');s.setProperty('--bg-c',hexA(g.bc,g.ba));if(g.bb>0)s.setProperty('--bg-bf','blur('+g.bb+'px)')}
const ap2=applyPrefs;applyPrefs=function(){ap2();applyGlass()};
function gset(k,v){S.glass[k]=v;S.glass.on=true;const e=document.getElementById('g_'+k);if(e)e.textContent=v;save();applyGlass()}
function grst(){S.glass={on:false,sc:'#fafbfd',sa:84,sb:30,bc:'#ffffff',ba:60,bb:0};save();applyGlass();render()}
function glassEditor(){const g=S.glass,rg=(k,l,mx)=>`<label><div class="rw"><span>${l}</span><b id="g_${k}">${g[k]}</b></div><input type="range" min="0" max="${mx}" value="${g[k]}" oninput="gset('${k}',+this.value)"></label>`;
 return `<h2>ظاهر پنجره‌ها و پس‌زمینه</h2><div class="edt"><div class="gprev"><div class="gp-sheet">نمونه پنجره</div></div><label><div class="rw"><span>رنگ پنجره‌ها (بازبینی سفارش و...)</span></div><input type="color" value="${g.sc}" oninput="gset('sc',this.value)"></label>${rg('sa','اوپسیتی پنجره',100)}${rg('sb','بلور پنجره',60)}<label><div class="rw"><span>رنگ پس‌زمینه کلی</span></div><input type="color" value="${g.bc}" oninput="gset('bc',this.value)"></label>${rg('ba','اوپسیتی پس‌زمینه',100)}${rg('bb','بلور پس‌زمینه',60)}<small style="margin-top:6px">پس‌زمینه‌ی کلی فقط در تم‌های مدرن و ایفون اثر دارد.</small><button class="ghost wide" onclick="grst()">بازگشت به پیش‌فرض</button></div>`}
const vs5=vSet;vSet=function(){let h=vs5();if(st=='look'){const i=h.indexOf('<h2>وزن فونت</h2>');if(i>=0)h=h.slice(0,i)+glassEditor()+h.slice(i)}return h};
function clr(){const o=S.orders[cur];if(o&&cnt(o)){const s=curSale();s.no=S.rn++;s.st='cancel';S.sales.push(s)}delete S.orders[cur];delete S.meta[cur];save();closeSheet();render()}
function doneList(){
 let a=S.sales.map((s,i)=>({...s,i}));const q=nd(dQ.trim().toLowerCase());
 if(q)a=a.filter(s=>nd([lb(s.table),s.cust&&s.cust.name,s.cust&&s.cust.phone,s.no,new Date(s.t).toLocaleDateString('fa-IR'),...s.items.map(i=>i.n)].join(' ')).toLowerCase().includes(q));
 a.sort((x,y)=>dS=='max'?y.total-x.total:y.t-x.t);
 const IK='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16 9.5"/></svg>',IX='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/></svg>';
 return a.map(s=>{const t=new Date(s.t),c=s.st=='cancel';
  return `<button class="li srow ${c?'cx':''}" onclick="reprint(${s.i})"><span class="si">${c?IX:IK}</span><div style="flex:1"><b>سفارش ${fa(s.no||0)} | ${E((s.cust&&s.cust.name)||lb(s.table))}</b><small>${t.toLocaleDateString('fa-IR')} - ${t.toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})}</small></div><div class="am" style="text-align:end"><b>${T(s.total)}</b><small class="${c?'cxt':'okt'}">${c?'لغو شد':'موفق'}</small></div></button>`}).join('')||'<p class="empty">موردی پیدا نشد.</p>'}
try{if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
applyPrefs();splash();render();
</script>
